fileType: momentic/test/v2
id: plotpro-super-admin-flow
description: Test Super Admin login and project approvals or dashboard access
retries: 0
defaultEnv: web
disabled: false
steps:
  - navigate: http://localhost:5173/login
  - type:
      text: "{{env.SUPERADMIN_EMAIL}}"
      into: email input field
      clear: inputs
  - type:
      text: "{{env.SUPERADMIN_PASSWORD}}"
      into: password input field
      clear: inputs
  - click: Login or Sign In button
  - assert: Verify Super Admin dashboard loads with management cards or navigation visible

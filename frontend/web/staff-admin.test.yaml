fileType: momentic/test/v2
id: plotpro-staff-admin-flow
description: Test Staff Admin login and projects access
retries: 0
defaultEnv: web
disabled: false
steps:
  - navigate: http://localhost:5173/login
  - type:
      text: "{{env.STAFFADMIN_EMAIL}}"
      into: email input field
      clear: inputs
  - type:
      text: "{{env.STAFFADMIN_PASSWORD}}"
      into: password input field
      clear: inputs
  - click: Login or Sign In button
  - assert: Verify Staff Admin dashboard loads with assigned projects or summary cards

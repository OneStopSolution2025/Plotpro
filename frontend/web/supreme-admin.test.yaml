fileType: momentic/test/v2
id: plotpro-supreme-admin-flow
description: Test Supreme Admin login and access to subscriber overview
retries: 0
defaultEnv: web
disabled: false
steps:
  - navigate: http://localhost:5173/login
  - type:
      text: "{{env.SUPREME_EMAIL}}"
      into: email input field
      clear: inputs
  - type:
      text: "{{env.SUPREME_PASSWORD}}"
      into: password input field
      clear: inputs
  - click: Login or Sign In button
  - assert: Verify Supreme Admin dashboard loads and navigation items are visible
